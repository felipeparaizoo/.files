font_size 13.0
window_padding_width 8
font_family      JetBrainsMono Nerd Font
italic_font      auto
# bold_font        auto
bold_italic_font auto
include theme.conf
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0

# Visual
tab_bar_style fade
tab_fade 2
cursor_blink_interval 0.5

# Performance
sync_to_monitor yes
fast_vector yes
window_resize_steps 2
input_delay 1
